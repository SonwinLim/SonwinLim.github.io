<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>AMG 2028 Planner</title>
<script>
(function(){var t=null;try{t=localStorage.getItem('amg-theme')}catch(e){}
if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;
try{var o=JSON.parse(localStorage.getItem('amg-login')||'null');if(o&&o.exp>Date.now())document.documentElement.classList.add('auto')}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#1c1416; --ink-2:#3a2d30; --muted:#6a5a5e;
  --rule:#e6dcde; --wash:#f3ecee; --cell:#d9c9cc;
  --red:#ef3340; --red-strong:#c8102e; --red-text:#c8102e; --red-wash:#fde9eb;
  --teal:#0b7a75; --teal-wash:#d9efec;
  --amber:#8a5200; --amber-wash:#fbebd0;
  --brick:#a83246; --brick-wash:#f5dadf; --brick-wash-2:#fbeef0;
  --merlion:#ef3340; --merlion-o:.075;
  --mk-body:#f2b01e; --mk-ink:#2a1a12;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Literata",Georgia,serif;
  --measure:66ch;
  --bd:1.5px solid var(--rule);
  --radius:8px;
  --radius-sm:6px;
  --pill:999px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#140f11; --panel:#1d1618; --ink:#f6eeef; --ink-2:#dccfd2; --muted:#a8979b;
  --rule:#35292c; --wash:#2a2023; --cell:#4a3a3e;
  --red-strong:#d8283a; --red-text:#ff6b76; --red-wash:#3a1519;
  --teal:#5fd6cf; --teal-wash:rgba(11,122,117,.3);
  --amber:#ffc266; --amber-wash:rgba(217,138,27,.2);
  --brick:#ff9aa8; --brick-wash:rgba(168,50,70,.34); --brick-wash-2:rgba(168,50,70,.14);
  --merlion:#ffffff; --merlion-o:.06;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red-text);outline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
input[type=password],input[type=text],input[type=number],input[type=month],select,textarea{border:var(--bd);border-radius:var(--radius-sm);background:var(--panel);padding:10px 12px}

/* collapsible sections: every header hides and shows what follows */
details.sec{border-bottom:1px solid var(--rule)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:flex-start;width:max-content;max-width:100%}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"Hide";flex:none;font-family:var(--display);font-weight:600;font-size:.72rem;color:var(--muted);border:1px solid var(--rule);border-radius:var(--pill);padding:2px 9px;margin-top:6px}
details.sec:not([open])>summary::after{content:"Show"}
details.sec>summary:hover h2,details.sec>summary:hover .lanes-h{color:var(--red-text)}
details.sec>summary:focus-visible{outline:3px solid var(--red-text);outline-offset:3px}
details.sec[open]>summary{margin-bottom:18px}
details.sec.phase>summary{width:auto;max-width:none}

/* Merlion: faint fixed backdrop, behind all content */
.merlion{position:fixed;right:-48px;bottom:-12px;width:min(78vw,460px);z-index:0;pointer-events:none;color:var(--merlion);opacity:var(--merlion-o)}
.merlion svg{display:block;width:100%;height:auto}
.merlion .cut{fill:var(--bg)}
#gate,#app{position:relative;z-index:1}
.auto #gate{visibility:hidden}

/* sprite shapes: one vocabulary for the gate and for the lanes */
svg.sh{display:block;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
svg.sh.f0{fill:none}
svg.sh.f1{fill:color-mix(in srgb,currentColor 30%,transparent)}
svg.sh.f2{fill:currentColor}

.tgl{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:.9rem}
.tgl:hover{border-color:var(--ink);color:var(--ink)}

/* ───────── gate ───────── */
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}
#gate .tgl{position:absolute;top:16px;right:16px}
.gate-in{width:min(100%,440px)}
#gate h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;letter-spacing:-.02em}
#gate .lead{margin-top:10px;color:var(--muted);max-width:34ch}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0 22px}
.cell{aspect-ratio:1;border:1.5px solid var(--cell);border-radius:6px;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.cell svg{width:46%;height:46%}
.cell.ask{border-style:dashed;border-color:var(--red-text);color:var(--red-text);font-family:var(--display);font-weight:700;font-size:2rem}
.cell.ask svg{display:none}
.cell.ask.solved{border-style:solid;color:var(--red)}
.cell.ask.solved .q{display:none}
.cell.ask.solved svg{display:block;animation:fill .35s ease-out}
@keyframes fill{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .cell{animation:cellin .45s ease-out both;animation-delay:calc(var(--i)*60ms)}
  @keyframes cellin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
#gate label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px}
#gate input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--cell);border-radius:6px;padding:12px 14px;font-size:16px}
#gate button[type=submit]{background:var(--red-strong);color:#fff;border:0;border-radius:6px;padding:12px 20px;font-weight:600;cursor:pointer}
#gate button[type=submit]:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.6em;margin-top:10px;color:var(--red-text)}

/* ───────── app ───────── */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid var(--red)}
.bar{display:flex;align-items:center;justify-content:space-between;height:50px;gap:16px}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.acts{display:flex;gap:8px}
.tnav{margin-left:auto;display:inline-flex;gap:18px}
.tnav a{font-size:.9rem;color:var(--muted);text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent}
.tnav a:hover{color:var(--ink);border-bottom-color:var(--red)}

/* frozen timeline track */
.trk{padding-bottom:8px}
.trk-in{position:relative;height:72px;margin:0 30px}
.trk-in::before{content:"";position:absolute;left:0;right:0;top:44px;height:2px;background:var(--rule)}
.trk ol{list-style:none}
.trk li{position:absolute;top:0;width:0}
.trk a{position:absolute;left:0;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:36px;text-decoration:none;color:var(--muted);min-width:44px;min-height:44px}
.trk .dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-2);position:absolute;top:39px}
.trk .star{width:18px;height:18px;position:absolute;top:36px;color:var(--red);fill:var(--red);stroke:var(--red)}
.trk .lb{font-family:var(--display);font-weight:700;font-size:.72rem;line-height:1;margin-top:20px;white-space:nowrap}
.trk a[aria-current=step]{color:var(--ink)}
.trk a[aria-current=step] .dot{background:var(--red);border-color:var(--red)}
.trk a:hover .lb{color:var(--ink)}
.mk{position:absolute;top:2px;left:0;width:22px;height:38px;transform:translateX(-50%);pointer-events:none;will-change:left}
.mk svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}

.hero{padding:44px 0 24px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5.4vw,3.7rem);line-height:1.04;letter-spacing:-.025em;max-width:16ch}
.hero .lead{margin-top:16px;max-width:var(--measure);color:var(--ink-2)}
.hero .budget{margin-top:12px;color:var(--muted);font-size:.95rem}
.hero .budget a{color:var(--red-text);font-weight:600;text-underline-offset:3px}
.hero .budget a:hover{color:var(--ink)}

.window,.phase,.checks{scroll-margin-top:calc(var(--hdr,130px) + 8px)}
.window{padding:12px 0 32px;border-bottom:1px solid var(--rule)}
.window h2,.lanes-h{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.015em;line-height:1.1}
.window>p{margin-top:8px;max-width:64ch;color:var(--ink-2);font-size:.97rem}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
@media (max-width:900px){.months{grid-template-columns:1fr}}
fieldset{border:0;min-width:0}
legend{font-family:var(--display);font-weight:700;padding:0;font-size:1.15rem}
.mrisk{margin-top:6px}
.mtext{margin-top:6px;color:var(--muted);font-size:.9rem}
.wins{list-style:none;margin-top:12px;display:grid;gap:8px}
.win input{position:absolute;opacity:0;pointer-events:none}
.wb{display:grid;gap:4px;border:var(--bd);border-radius:var(--radius);padding:10px 12px;background:var(--panel);cursor:pointer}
.wb .wr{font-family:var(--display);font-weight:700}
.wb small{color:var(--muted);font-size:.84rem;line-height:1.45}
.wb .tag{justify-self:start}
.win input:checked+.wb{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:var(--red-wash)}
.win input:focus-visible+.wb{outline:3px solid var(--red-text);outline-offset:2px}
.prov{margin-top:16px;display:inline-block;color:var(--amber);background:var(--amber-wash);padding:3px 10px;border-radius:4px;font-size:.88rem}

.lanes{padding:20px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;align-items:center;gap:8px;border:var(--bd);border-radius:var(--radius);padding:8px 14px;background:var(--panel);cursor:pointer;line-height:1.3}
.opt svg{width:16px;height:16px;flex:none}
.opt input:checked+span{border-color:var(--red);background:var(--red-wash)}
.opt input:not(:checked)+span{opacity:.6}
.opt input:focus-visible+span{outline:3px solid var(--red-text);outline-offset:2px}

.phase{display:grid;grid-template-columns:210px 1fr;gap:0 32px;padding:36px 0;border-bottom:1px solid var(--rule)}
@media (max-width:760px){.phase{grid-template-columns:1fr;gap:14px}}
.rail{align-self:start;position:sticky;top:calc(var(--hdr,130px) + 16px)}
@media (max-width:760px){.rail{position:static}}
.rail h2{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;letter-spacing:-.015em}
.rail .psub{margin-top:4px;font-weight:600;color:var(--red-text);font-size:.95rem}
.rail .when{margin-top:6px;color:var(--muted);font-size:.92rem}
.items{list-style:none;border-left:2px solid var(--rule);padding-left:22px;position:relative}
.items::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.item{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:0 0 22px}
.item+.item{padding-top:22px;border-top:1px solid var(--rule)}
.item:last-child{padding-bottom:0}
.item .sh{width:18px;height:18px;margin-top:5px;color:var(--ink)}
.item.milestone{border:1.5px solid var(--red);border-radius:10px;padding:16px 16px 16px 12px;background:var(--red-wash);margin:0 0 22px -8px}
.item.milestone+.item{border-top:0;padding-top:0}
.item.milestone .sh{color:var(--red);fill:var(--red);stroke:var(--red)}
.item.milestone .text{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.3}
.text{max-width:var(--measure)}
.detail{color:var(--muted);font-size:.93rem;margin-top:4px;max-width:var(--measure)}
.meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.85rem;color:var(--muted)}
.meta a{color:var(--red-text);font-weight:600;text-underline-offset:3px}
.tm{font-family:var(--display);font-weight:700;color:var(--ink-2)}
.tag{padding:1px 8px;border-radius:4px;font-size:.8rem;font-weight:600;line-height:1.5;display:inline-block}
.tag.amber{background:var(--amber-wash);color:var(--amber)}
.tag.teal{background:var(--teal-wash);color:var(--teal)}
.tag.brick{color:var(--brick);background:repeating-linear-gradient(135deg,var(--brick-wash) 0 5px,var(--brick-wash-2) 5px 8px)}
.tag.plain{background:var(--wash);color:var(--ink-2)}

.checks{padding:40px 0 8px}
.checks h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.1;letter-spacing:-.02em}
.checks>p{margin-top:8px;max-width:var(--measure);color:var(--ink-2)}
.checks ul{list-style:none;margin-top:22px;border-top:1px solid var(--rule)}
.checks li{display:grid;grid-template-columns:130px 1fr;gap:6px 20px;padding:16px 0;border-bottom:1px solid var(--rule)}
@media (max-width:640px){.checks li{grid-template-columns:1fr}}
.checks li .tag{justify-self:start;align-self:start}
.checks h3{font-family:var(--display);font-weight:700;font-size:1.05rem}
.checks li p{color:var(--muted);font-size:.95rem;max-width:var(--measure)}
.foot{padding:36px 0 56px;color:var(--muted);font-size:.88rem;max-width:70ch}

@media (max-width:600px){
  .bar{flex-wrap:wrap;height:auto;min-height:50px;padding:6px 0;row-gap:6px}
  .tnav{gap:14px}
  .acts{margin-left:auto}
  .wrap{padding:0 16px}
  .trk-in{margin:0 26px}
  .hero{padding:28px 0 16px}
  .phase{padding:28px 0}
  .items{padding-left:14px}
  .item{grid-template-columns:14px 1fr;gap:10px}
  .item .sh{width:14px;height:14px;margin-top:6px}
  .item.milestone{margin-left:-4px;padding:14px 12px 14px 10px}
  .text{font-size:16px;line-height:1.55}
  .detail{font-size:.88rem}
  .checks{padding-top:32px}
  .tgl{padding:6px 10px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s-c" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/></symbol>
  <symbol id="s-s" viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="2"/></symbol>
  <symbol id="s-t" viewBox="0 0 40 40"><path d="M20 5 L36 34 L4 34 Z"/></symbol>
  <symbol id="s-m" viewBox="0 0 40 40"><polygon points="20,3 25.5,15 38.5,16 28.5,25 31.5,37.5 20,31 8.5,37.5 11.5,25 1.5,16 14.5,15"/></symbol>
  <symbol id="s-bottle" viewBox="0 0 24 44">
    <path style="fill:var(--mk-body);stroke:var(--mk-ink);stroke-width:1.6;stroke-linejoin:round" d="M9.5 2h5v10.5l3.2 5.2c.9 1.6 1.3 3 1.3 5.3V39a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V23c0-2.3.4-3.7 1.3-5.3l3.2-5.2z"/>
    <path style="fill:none;stroke:var(--mk-ink);stroke-width:2.2;stroke-linecap:round" d="M5.6 23.5l12.8 3M5.4 30l13.2 3M5.4 36.5l13.2 2.6M7 18.5l10 2"/>
  </symbol>
</svg>

<!-- Merlion: original silhouette, faint backdrop. The Merlion mark belongs to the Singapore Tourism Board. -->
<div class="merlion" aria-hidden="true">
  <svg viewBox="0 0 400 640">
    <g fill="currentColor">
      <g>
        <circle cx="240" cy="120" r="24"/><circle cx="233" cy="145" r="24"/><circle cx="215" cy="163" r="24"/><circle cx="190" cy="170" r="24"/>
        <circle cx="165" cy="163" r="24"/><circle cx="147" cy="145" r="24"/><circle cx="140" cy="120" r="24"/><circle cx="147" cy="95" r="24"/>
        <circle cx="165" cy="77" r="24"/><circle cx="190" cy="70" r="24"/><circle cx="215" cy="77" r="24"/><circle cx="233" cy="95" r="24"/>
        <circle cx="190" cy="120" r="46"/>
        <circle cx="152" cy="60" r="13"/><circle cx="228" cy="60" r="13"/>
      </g>
      <path d="M156 168C124 238 122 336 178 414c30 42 52 82 30 132l46-12c38-66 34-134 6-196-24-56-6-112-30-170z"/>
      <path d="M208 546c-20 32-52 50-96 40 34-14 56-34 70-62zM254 534c30 26 66 34 100 14-36-4-60-22-76-44z"/>
      <path d="M0 596c32-14 62-14 94 0s62 14 94 0 62-14 94 0 62 14 94 0 32-10 24-4V640H0z"/>
      <path d="M148 130C100 118 66 150 56 214" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <path d="M150 140C112 136 86 160 78 214" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <path d="M46 214c16 12 32 12 48 0 0 20 6 36 14 50-26 10-54 8-76-2 4-14 8-30 14-48z"/>
    </g>
    <g class="cut">
      <circle cx="174" cy="114" r="5"/><circle cx="206" cy="114" r="5"/>
      <path d="M190 124l-9 14h18z"/>
      <path d="M172 146c10 8 26 8 36 0-4 12-32 12-36 0z"/>
      <g fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round">
        <path d="M150 230c14 10 30 10 44 0M200 230c12 8 26 8 40 0M144 272c16 12 34 12 50 0M196 272c14 10 30 10 44 0M146 318c16 12 34 12 50 0M198 318c14 10 28 10 40 0M156 364c16 12 32 12 48 0M206 364c12 8 24 8 34 0M174 410c14 10 28 10 42 0M210 410c10 8 20 8 28 0M190 456c12 8 26 8 38 0M206 502c10 6 20 6 28 0"/>
      </g>
    </g>
  </svg>
</div>

<main id="gate">
  <button class="tgl" type="button" id="theme-gate">Dark mode</button>
  <div class="gate-in">
    <h1>AMG 2028 Planner</h1>
    <p class="lead">Private planning workspace. Enter the password to continue.</p>
    <div class="matrix" aria-hidden="true" id="matrix"></div>
    <form id="form" autocomplete="off">
      <label for="pw">Password</label>
      <div class="row">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button id="go" type="submit">Unlock</button>
      </div>
      <p id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gate=$('#gate'), app=$('#app'), msg=$('#msg');

  /* theme toggle: the button names the mode it switches to */
  function themeBtns(){return document.querySelectorAll('#theme-gate,#theme')}
  function paintTheme(){
    var dark=document.documentElement.dataset.theme==='dark';
    themeBtns().forEach(function(b){b.textContent=dark?'Light mode':'Dark mode'});
  }
  function flipTheme(){
    var t=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=t;
    try{localStorage.setItem('amg-theme',t)}catch(e){}
    paintTheme();
  }
  $('#theme-gate').addEventListener('click',flipTheme);
  paintTheme();

  /* gate matrix: shape by (row+col)%3, fill by row; cell 9 is the answer */
  var shapes=['s-c','s-s','s-t'], mx=$('#matrix'), html='';
  for(var r=0;r<3;r++)for(var c=0;c<3;c++){
    var i=r*3+c, sym=shapes[(r+c)%3];
    var svg='<svg class="sh f'+r+'" viewBox="0 0 40 40"><use href="#'+sym+'"/></svg>';
    html+= (i===8)
      ? '<div class="cell ask" id="ask" style="--i:8"><span class="q">?</span>'+svg+'</div>'
      : '<div class="cell" style="--i:'+i+'">'+svg+'</div>';
  }
  mx.innerHTML=html;

  var b64=function(s){return Uint8Array.from(atob(s),function(ch){return ch.charCodeAt(0)})};
  async function decrypt(pw){
    var p=JSON.parse($('#payload').textContent);
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
    return new TextDecoder().decode(buf);
  }
  /* one login for every AMG page on this origin: localStorage "amg-login" = {pw, exp}, 12 hours */
  var KEY='amg-login', TTL=12*60*60*1000;
  var store={
    get:function(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');return(o&&typeof o.pw==='string'&&o.exp>Date.now())?o.pw:null}catch(e){return null}},
    set:function(v){try{localStorage.setItem(KEY,JSON.stringify({pw:v,exp:Date.now()+TTL}))}catch(e){}},
    clear:function(){try{localStorage.removeItem(KEY)}catch(e){}}
  };

  async function attempt(pw,silent){
    if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser blocks decryption here. Open the page over HTTPS or as a local file.';return}
    var go=$('#go'); go.disabled=true; if(!silent)msg.textContent='Checking…';
    try{
      var out=await decrypt(pw);
      if(!silent)store.set(pw);
      if(!silent&&!reduce){$('#ask').classList.add('solved');await new Promise(function(r){setTimeout(r,450)})}
      show(out);
    }catch(e){
      /* a stored login that fails here is left alone: another AMG page may still accept it */
      document.documentElement.classList.remove('auto');
      if(!silent)msg.textContent='Wrong password. Check it and try again.';
    }finally{go.disabled=false}
  }
  $('#form').addEventListener('submit',function(e){e.preventDefault();attempt($('#pw').value,false)});
  var saved=store.get(); if(saved)attempt(saved,true);

  function show(out){
    app.innerHTML=out; gate.hidden=true; app.hidden=false; document.title='AMG 2028 Timeline';
    window.scrollTo(0,0); initApp();
  }

  /* ───── timeline behaviour ───── */
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function shift(T,o){
    var x=new Date(T.getTime());
    if(o.u==='m')x.setUTCMonth(x.getUTCMonth()+o.n);
    else if(o.u==='w')x.setUTCDate(x.getUTCDate()+7*o.n);
    else x.setUTCDate(x.getUTCDate()+o.n);
    return x;
  }
  function ym(x){return MON[x.getUTCMonth()]+' '+x.getUTCFullYear()}
  function monthRange(a,b){
    var sa=ym(a), sb=ym(b);
    if(sa===sb)return sa;
    if(a.getUTCFullYear()===b.getUTCFullYear())return MON[a.getUTCMonth()]+' to '+sb;
    return sa+' to '+sb;
  }
  function dayRange(a,b){
    return WD[a.getUTCDay()]+' '+a.getUTCDate()+' '+(a.getUTCMonth()===b.getUTCMonth()?'':MON[a.getUTCMonth()]+' ')+'to '+WD[b.getUTCDay()]+' '+b.getUTCDate()+' '+MON[b.getUTCMonth()]+' '+b.getUTCFullYear();
  }
  function initApp(){
    if(app.querySelector('input[name=t]'))initTimeline();
    $('#theme').addEventListener('click',flipTheme); paintTheme();
    $('#lock').addEventListener('click',function(){store.clear();location.reload()});
    /* a section link must open a collapsed section before it can scroll to it */
    function openHash(){
      var id=decodeURIComponent(location.hash.slice(1)); if(!id)return;
      var el=document.getElementById(id);
      if(el&&el.tagName==='DETAILS'&&!el.open)el.open=true;
    }
    addEventListener('hashchange',openHash); openHash();
  }
  function initTimeline(){
    var T=null, top=app.querySelector('.top');
    function label(el){
      var offs=JSON.parse(el.getAttribute('data-off'));
      var pts=offs.map(function(o){return o.u==='now'?new Date():o.u==='abs'?new Date(o.iso+'T00:00:00Z'):shift(T,o)});
      var day=el.hasAttribute('data-day');
      var s=day?dayRange(pts[0],pts[pts.length-1]):monthRange(pts[0],pts[pts.length-1]);
      el.textContent=(day?'':'≈ ')+s+(day?' (provisional)':'');
    }
    function paint(){app.querySelectorAll('[data-off]').forEach(label)}
    app.querySelectorAll('input[name=t]').forEach(function(r){
      r.addEventListener('change',function(){if(r.checked){T=new Date(r.value+'T00:00:00Z');paint()}});
    });
    var checked=app.querySelector('input[name=t]:checked');
    T=new Date(checked.value+'T00:00:00Z'); paint();

    /* lane filter; items with a lane that has no checkbox always show */
    function filter(){
      var on={};
      app.querySelectorAll('input[name=lane]').forEach(function(c){on[c.value]=c.checked});
      app.querySelectorAll('.phase').forEach(function(ph){
        var any=false;
        ph.querySelectorAll('.item').forEach(function(it){
          var show=on[it.getAttribute('data-lane')]!==false; it.hidden=!show; if(show)any=true;
        });
        ph.hidden=!any;
      });
      place();
    }
    app.querySelectorAll('input[name=lane]').forEach(function(c){c.addEventListener('change',filter)});

    /* frozen track: the bottle follows scroll between phase nodes */
    var phases=[].slice.call(app.querySelectorAll('.phase'));
    var nodes=[].slice.call(app.querySelectorAll('.trk a'));
    var mk=app.querySelector('#mk');
    var queued=false;
    function place(){
      queued=false;
      var hdr=top.offsetHeight; app.style.setProperty('--hdr',hdr+'px');
      var n=phases.length, ref=hdr+(innerHeight-hdr)*0.3, tops=[], nxt=Infinity, i;
      for(i=n-1;i>=0;i--){ if(!phases[i].hidden)nxt=phases[i].getBoundingClientRect().top; tops[i]=nxt; }
      var x=0, cur=-1;
      if(tops[0]<=ref){
        var k=0; for(i=0;i<n;i++){ if(tops[i]<=ref)k=i; }
        cur=k;
        if(k===n-1)x=1;
        else{
          var span=tops[k+1]-tops[k];
          var t=(isFinite(span)&&span>0)?Math.min(1,Math.max(0,(ref-tops[k])/span)):0;
          x=(k+t)/(n-1);
        }
      }
      mk.style.left=(x*100)+'%';
      nodes.forEach(function(a,j){ if(j===cur)a.setAttribute('aria-current','step'); else a.removeAttribute('aria-current'); });
    }
    function queue(){ if(!queued){queued=true;requestAnimationFrame(place)} }
    addEventListener('scroll',queue,{passive:true});
    addEventListener('resize',queue);
    place();
  }
})();
</script>
</body>
