function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
document.getElementById("f").addEventListener("submit",async function(e){
 e.preventDefault();var msg=document.getElementById("msg");msg.textContent="Opening...";
 try{
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
 }catch(err){msg.textContent="Wrong password. Try again.";}
});
