var KEY="amg-login",TTL=12*60*60*1000;
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
async function decrypt(pw){

 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

}

async function attempt(pw,silent){
 var msg=document.getElementById("msg"),go=document.getElementById("go");
 if(!(window.crypto&&crypto.subtle)){document.documentElement.classList.remove("auto");msg.textContent="This browser blocks decryption here. Open the page over HTTPS.";return}

  document.documentElement.classList.remove("auto");go.disabled=false;
  if(!silent)msg.textContent="Wrong password. Try again.";else msg.textContent="";
