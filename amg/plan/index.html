<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">

<meta name="color-scheme" content="light dark">
<title>AMG 2028 Planning Hub</title>

document.documentElement.dataset.theme=t;

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--panel:#fff;--ink:#1c1416;--ink-2:#3a2d30;--muted:#6a5a5e;--rule:#e6dcde;--wash:#f3ecee;--cell:#d9c9cc;
  --red:#ef3340;--red-strong:#c8102e;--red-text:#c8102e;--red-wash:#fde9eb;
  --teal:#0b7a75;--teal-wash:#d9efec;--amber:#8a5200;--amber-wash:#fbebd0;--brick:#a83246;--brick-wash:#f5dadf;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Literata",Georgia,serif;
  --measure:68ch;--bd:1.5px solid var(--rule);--radius:8px;color-scheme:light;
}
:root[data-theme=dark]{--bg:#140f11;--panel:#1d1618;--ink:#f6eeef;--ink-2:#dccfd2;--muted:#a8979b;--rule:#35292c;--wash:#2a2023;--cell:#4a3a3e;
  --red-text:#ff6b76;--red-wash:#3a1519;--teal:#5fd6cf;--teal-wash:rgba(11,122,117,.3);--amber:#ffc266;--amber-wash:rgba(217,138,27,.2);--brick:#ff9aa8;--brick-wash:rgba(168,50,70,.34);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red-text);outline-offset:3px}
button,input{font:inherit;color:inherit}
#gate,#app{position:relative;z-index:1}
.auto #gate{visibility:hidden}
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}
.gate-in{width:min(100%,440px)}
#gate h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;letter-spacing:-.02em}
#gate .lead{margin-top:10px;color:var(--muted);max-width:36ch}
#gate label{display:block;font-weight:600;margin:22px 0 6px}
.row{display:flex;gap:8px}
#gate input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--cell);border-radius:6px;padding:12px 14px;font-size:16px}
#gate button[type=submit]{background:var(--red-strong);color:#fff;border:0;border-radius:6px;padding:12px 20px;font-weight:600;cursor:pointer}
#gate button[type=submit]:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.6em;margin-top:10px;color:var(--red-text)}
.tgl{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:.9rem}
.tgl:hover{border-color:var(--ink);color:var(--ink)}
#theme-gate{position:absolute;top:16px;right:16px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(8px);border-bottom:3px solid var(--red)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.nav{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0;padding:0;list-style:none}
.nav a{font-family:var(--display);font-weight:600;font-size:.85rem;color:var(--muted);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink);border-bottom-color:var(--red)}
.acts{display:flex;gap:8px}
.hero{padding:44px 0 20px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.025em;max-width:18ch}
.hero .lead{margin-top:14px;max-width:var(--measure);color:var(--ink-2)}
.hero .meta{margin-top:14px;color:var(--muted);font-size:.92rem}
section.blk{padding:34px 0;border-top:1px solid var(--rule);scroll-margin-top:64px}
section.blk>h2{font-family:var(--display);font-weight:700;font-size:1.75rem;letter-spacing:-.015em;line-height:1.1}
section.blk>p.intro{margin-top:8px;max-width:var(--measure);color:var(--ink-2)}
h3{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:22px 0 6px}
p{margin:0 0 10px;max-width:var(--measure)}
ul.plain,ol.plain{margin:6px 0 14px;padding-left:22px;max-width:var(--measure)}
ul.plain li,ol.plain li{margin-bottom:6px}
table{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:.95rem}
th{font-family:var(--display);font-weight:700;text-align:left;font-size:.85rem;color:var(--muted);padding:0 10px 6px 0;border-bottom:1px solid var(--ink)}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.d{white-space:nowrap;font-family:var(--display);font-weight:600;font-size:.87rem}
.tag{padding:1px 8px;border-radius:4px;font-size:.78rem;font-weight:600;display:inline-block;line-height:1.5}
.tag.amber{background:var(--amber-wash);color:var(--amber)}
.tag.teal{background:var(--teal-wash);color:var(--teal)}
.tag.brick{background:var(--brick-wash);color:var(--brick)}
.tag.plain{background:var(--wash);color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.card{border:var(--bd);border-radius:var(--radius);padding:14px 16px;background:var(--panel)}
.card h3{margin:0 0 4px}
.card p{font-size:.93rem;color:var(--ink-2);margin:0}
.big{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.1}
.note{background:var(--wash);border-left:3px solid var(--red);padding:12px 16px;border-radius:0 6px 6px 0;margin:16px 0;max-width:var(--measure)}
.foot{padding:34px 0 56px;color:var(--muted);font-size:.88rem;max-width:70ch}
@media (max-width:700px){
  body{overflow-x:hidden}
  .wrap{padding:0 16px}
  .bar{height:auto;padding:8px 0;gap:6px 10px}
  .brand{flex:1 1 auto}
  .acts{order:2}
  .nav{order:3;flex:1 1 100%;min-width:0;gap:0 12px;overflow-x:auto;padding-bottom:2px}
  .nav a{white-space:nowrap;font-size:.8rem}
  .hero{padding:28px 0 14px}
  .hero h1{font-size:clamp(1.7rem,8vw,2.4rem);max-width:none}
  table,thead,tbody,tr,th,td{display:block}thead{display:none}
  tr{padding:10px 0;border-bottom:1px solid var(--rule)}
  td{border:0;padding:1px 0;white-space:normal}
  td.d{font-size:.95rem;margin-bottom:2px}
}
@media print{html{background:#fff}#gate,.top{display:none}section.blk{break-inside:avoid}}
</style>
</head>
<body>
<main id="gate">
  <button class="tgl" type="button" id="theme-gate">Dark mode</button>
  <div class="gate-in">
    <h1>AMG 2028 Planning Hub</h1>
    <p class="lead">Private planning workspace: timeline, workstreams, venue and budget, volunteers, programme and risks. Enter the password to continue.</p>
    <form id="form" autocomplete="off">
      <label for="pw">Password</label>
      <div class="row"><input id="pw" type="password" autocomplete="current-password" required><button id="go" type="submit">Unlock</button></div>
      <p id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
<div id="app" hidden></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var gate=$('#gate'),app=$('#app'),msg=$('#msg');
  function flip(){
    var t=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=t;
    try{localStorage.setItem('amg-theme',t)}catch(e){}
    paint();
  }
  function paint(){var d=document.documentElement.dataset.theme==='dark';document.querySelectorAll('#theme-gate,#theme').forEach(function(b){if(b)b.textContent=d?'Light mode':'Dark mode'})}
  $('#theme-gate').addEventListener('click',flip);paint();
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  async function decrypt(pw){
    var p=JSON.parse($('#payload').textContent);
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
    return new TextDecoder().decode(buf);
  }
  var KEY='amg-login',TTL=12*60*60*1000;
  var store={
    get:function(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');return(o&&typeof o.pw==='string'&&o.exp>Date.now())?o.pw:null}catch(e){return null}},
    set:function(v){try{localStorage.setItem(KEY,JSON.stringify({pw:v,exp:Date.now()+TTL}))}catch(e){}},
    clear:function(){try{localStorage.removeItem(KEY)}catch(e){}}
  };
  async function attempt(pw,silent){
    if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser blocks decryption here. Open the page over HTTPS or as a local file.';return}
    var go=$('#go');go.disabled=true;if(!silent)msg.textContent='Checking…';
    try{
      var out=await decrypt(pw);if(!silent)store.set(pw);
      app.innerHTML=out;gate.hidden=true;app.hidden=false;document.documentElement.classList.remove('auto');
      if($('#theme'))$('#theme').addEventListener('click',flip);paint();
      if($('#lock'))$('#lock').addEventListener('click',function(){store.clear();location.reload()});
      window.scrollTo(0,0);
    }catch(e){document.documentElement.classList.remove('auto');if(!silent)msg.textContent='Wrong password. Check it and try again.'}
    finally{go.disabled=false}
  }
  $('#form').addEventListener('submit',function(e){e.preventDefault();attempt($('#pw').value,false)});
  var saved=store.get();if(saved)attempt(saved,true);
})();
</script>
</body>
